<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>cresslet-container demo</title>
    <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css" />
    <script crossorigin src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js"></script>
    <script crossorigin src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.js"></script>
    <style>
      :root { color-scheme: dark; --bg: #0e1116; --panel: #161b22; --line: #30363d; --fg: #e6edf3; --dim: #8b949e; --accent: #3fb950; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; }
      body { display: grid; grid-template-rows: auto 1fr; }
      header { display: flex; gap: 12px; align-items: center; padding: 8px 14px; border-bottom: 1px solid var(--line); }
      header b { color: var(--accent); }
      #status { color: var(--dim); font-size: 12px; }
      header button { margin-left: auto; background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
      main { display: grid; grid-template-columns: 1fr 1fr; min-height: 0; }
      #term { padding: 6px; min-height: 0; overflow: hidden; border-right: 1px solid var(--line); }
      #preview { display: grid; grid-template-rows: auto 1fr; min-height: 0; }
      #url { padding: 6px 10px; font: 12px ui-monospace, monospace; color: var(--dim); border-bottom: 1px solid var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      iframe { width: 100%; height: 100%; border: 0; background: #fff; }
      @media (max-width: 800px) { main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; } #term { border-right: 0; border-bottom: 1px solid var(--line); } }
    </style>
  </head>
  <body>
    <header><b>cresslet-container</b><span id="status">booting…</span><button id="edit">Edit App.tsx</button></header>
    <main>
      <div id="term"></div>
      <section id="preview"><div id="url">waiting for server…</div><iframe id="frame" title="preview"></iframe></section>
    </main>
    <script type="module">
      import { Container } from '/dist/cresslet-container.js'

      const files = {
        'package.json': { file: { contents: JSON.stringify({ name: 'demo-app', private: true, version: '0.0.0', type: 'module', scripts: { dev: 'vite', build: 'tsc -b && vite build', preview: 'vite preview' }, dependencies: { react: '^19.1.0', 'react-dom': '^19.1.0' } }, null, 2) } },
        'index.html': { file: { contents: `<!doctype html>\n<html>\n  <head><meta charset="utf-8" /><title>Demo app</title></head>\n  <body>\n    <div id="root"></div>\n    <script type="module" src="/src/main.tsx"><\/script>\n  </body>\n</html>\n` } },
        'tsconfig.json': { file: { contents: JSON.stringify({ compilerOptions: { jsx: 'react-jsx', strict: true, target: 'ES2022', module: 'ESNext', moduleResolution: 'bundler' } }, null, 2) } },
        src: {
          directory: {
            'main.tsx': { file: { contents: `import { StrictMode } from 'react'\nimport { createRoot } from 'react-dom/client'\nimport App from './App'\nimport './index.css'\n\ncreateRoot(document.getElementById('root')!).render(<StrictMode><App /></StrictMode>)\n` } },
            'App.tsx': { file: { contents: `import { useState } from 'react'\n\nexport default function App() {\n  const [count, setCount] = useState(0)\n  return (\n    <main>\n      <h1>Hello from Cresslet</h1>\n      <button onClick={() => setCount((c) => c + 1)}>count is {count}</button>\n    </main>\n  )\n}\n` } },
            'index.css': { file: { contents: `body { font-family: system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh; margin: 0; background: #f6f8fa; }\nh1 { color: #1f883d; }\nbutton { font-size: 16px; padding: 8px 16px; }\n` } },
          },
        },
      }

      const status = (s) => (document.getElementById('status').textContent = s)
      const term = new Terminal({ convertEol: false, fontSize: 13, theme: { background: '#0e1116' } })
      const fit = new FitAddon.FitAddon()
      term.loadAddon(fit)
      term.open(document.getElementById('term'))
      fit.fit()
      addEventListener('resize', () => fit.fit())

      // ?previewOrigin=http://127.0.0.1:4401 serves previews from a separate origin (see scripts/serve.ts);
      // ?previewOrigins=http://{id}-{port}.localhost:4401 gives each preview its own
      const q = new URLSearchParams(location.search)
      const c = await Container.boot({ previewOrigin: q.get('previewOrigin') ?? undefined, previewOrigins: q.get('previewOrigins') ?? undefined })
      window.container = c
      c.on('error', (e) => term.write(`\r\n\x1b[31m${e.message}\x1b[0m\r\n`))
      c.on('server-ready', (port, url) => {
        if (port !== 5173) return
        document.getElementById('url').textContent = url
        document.getElementById('frame').src = url
        status(`server ready on :${port}`)
        window.previewUrl = url
      })
      await c.mount(files)
      status('installing…')

      const shell = await c.spawn('jsh')
      shell.output.pipeTo(new WritableStream({ write: (d) => term.write(d) }))
      const input = shell.input.getWriter()
      term.onData((d) => input.write(d))
      window.shellInput = input
      input.write('npm install && npm run dev\r')

      document.getElementById('edit').onclick = () => c.fs.writeFile('src/App.tsx', `export default function App() {\n  return <main><h1>Edited at ${new Date().toLocaleTimeString()}</h1></main>\n}\n`)
    </script>
  </body>
</html>
